id = "superpowers"
name = "Superpowers"
version = "0.7.0"
description = "Twelve super powers, Superflight, a 40-chunk Cataclysm, the Storm Scepter (13 disasters), a Gravity Gun, and five fully simulated jets with cockpits and weapons. Press H for the keys."
authors = ["pressflowed"]
api = "0.2"
side = "both"
capabilities = ["registries"]

# Made for Horizon Nightly 2026-11-19.
[native]
game = "26.3"
horizon = "f00125f61f794aaa3d4e950d301f353b35b6ee3d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# The effects and the jets draw with the GPU once the world is drawn, and past the 10 degrees of
# roll a camera shake may give, the picture turns the rest of the way (Superflight's rolls, a
# jet's cockpit). Only functions below the game crate are patched: on this Nightly a patch of a
# function in the game crate's `game` modules doesn't compile.
[[native.mixin]]
id = "draw"
target = "horizon_mod_render::render::world_drawn"
kind = "HEAD"
helper = "src/mixins/draw.rs"
bindings = [{ name = "world", ty = "&mut WorldDrawn<'_>", value = "&mut *world" }]

# They read the world's depth: to hide behind hills, and to light the ground.
[[native.mixin]]
id = "needs"
target = "horizon_mod_render::render::render_needs"
kind = "HEAD"
helper = "src/mixins/needs.rs"
bindings = [{ name = "needs", ty = "&mut RenderNeeds", value = "&mut *needs" }]
