id = "superpowers"
name = "Superpowers"
version = "0.3.0"
description = "Twelve super powers with big visuals, elytra-style superflight with barrel rolls and loops, a 40-chunk Cataclysm, a keybind panel, and aurora night skies."
authors = ["pressflowed"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Superflight rolls the camera all the way round. The game bounds the camera shake mods add to 10
# degrees a side; this keeps that bound for pitch, yaw and offset but lets roll turn freely.
[[native.mixin]]
id = "unbounded-roll"
target = "horizon_client::game::native_hooks::camera_pose::bounded_shake"
kind = "OVERWRITE"
helper = "src/mixins/unbounded_shake.rs"
bindings = [
  { name = "shake", ty = "Shake", value = "shake" },
  { name = "scale", ty = "f32", value = "scale" },
]
