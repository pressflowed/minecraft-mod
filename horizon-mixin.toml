# Superpowers: a native trait mod for Horizon (Minecraft Java 26.3 in Rust).
# Twelve super powers (six of them mega powers), elytra-style Superflight with barrel rolls and loops,
# a 40-chunk Cataclysm, a keybind panel, and aurora night skies.
# Install it from the launcher's Mods page with "Add from GitHub", or build this folder with
# `horizon-launcher native-build <this folder> --instance <instance> --trust-native-code`.
[mod]
id = "superpowers"
version = "0.4.0"

# The same Horizon commit Orbital Laser pins, so both mods build into one game.
[compatibility]
horizon_revision = "e57b1d34bb0dcf6bf081c19fe6d2e7f69b60cdf4"

[api]
path = "api"

# Superflight rolls and loops the camera all the way round. The game bounds the camera shake
# mods add to 10 degrees a side; this keeps that bound for yaw and offset, and lets pitch and
# roll turn freely.
[[injection]]
id = "unbounded-shake"
target = "horizon_client::game::native_hooks::bounded_shake"
kind = "OVERWRITE"
helper = "mixins/unbounded_shake.rs"
bindings = [
  { name = "shake", ty = "NativeShake", value = "shake" },
  { name = "scale", ty = "f32", value = "scale" },
]
